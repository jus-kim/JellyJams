<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- sheet corner -->
  <rect x="5" y="5" width="40" height="34" rx="3" fill="#ffffff" stroke="#5a6572" stroke-width="3"/>
  <!-- shape -->
  <path d="M 19 55 L 55 23" fill="none" stroke="#1a76c4" stroke-width="5" stroke-linecap="round"/>
