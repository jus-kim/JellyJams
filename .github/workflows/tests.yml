name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference Qt binding
        run: python -m pip install PySide6==6.8.3
      - name: Run headless tests (FreeCAD APIs stubbed)
        run: python tests/test_headless.py -q
      - name: Test GUI result validation
        run: python tests/test_gui_runner.py
